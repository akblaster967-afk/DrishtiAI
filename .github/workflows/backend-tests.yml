name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Run backend test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.cloud.txt

      - name: Install runtime dependencies
        run: python -m pip install -r backend/requirements.cloud.txt

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend
